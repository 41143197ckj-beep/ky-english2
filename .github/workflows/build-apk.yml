name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      -  - name: Install Android SDK components
       
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_TOOL="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_TOOL"
          "$SDK_TOOL" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: "ky-english2-v42-github-build 2"
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ky-english2-v4.2-apk
          path: "ky-english2-v42-github-build 2/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
