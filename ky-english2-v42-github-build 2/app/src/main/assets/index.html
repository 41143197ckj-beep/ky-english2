,"trans":"处理问题","tip":"不只是“期刊”","sentence":"We need to address an issue before it becomes worse.","sentenceZh":"我们需要在问题变得更糟之前处理它。"},{"w":"address","zh":"处理；地址；演讲","phrase":"address a problem","trans":"处理问题","tip":"常考动词义","sentence":"The report attempts to address a problem in education.","sentenceZh":"这份报告试图解决教育中的一个问题。"},{"w":"subject","zh":"主题；使遭受","phrase":"be subject to change","trans":"可能发生变化","tip":"subject to是重要搭配","sentence":"The schedule may be subject to change.","sentenceZh":"日程安排可能会发生变化。"},{"w":"account","zh":"解释；账户；占比","phrase":"account for the change","trans":"解释变化","tip":"account for多义","sentence":"Several factors account for the change in behavior.","sentenceZh":"几个因素解释了这种行为变化。"},{"w":"claim","zh":"声称；主张","phrase":"claim that it is true","trans":"声称这是真的","tip":"不一定代表事实","sentence":"The author does not claim that it is true in every case.","sentenceZh":"作者并未声称这在所有情况下都成立。"},{"w":"feature","zh":"特征；以…为特色","phrase":"a key feature","trans":"关键特征","tip":"名词和动词","sentence":"Flexibility is a key feature of the new system.","sentenceZh":"灵活性是新系统的一个关键特征。"},{"w":"reflect","zh":"反映；反思","phrase":"reflect social changes","trans":"反映社会变化","tip":"reflect on表示反思","sentence":"These figures reflect social changes over time.","sentenceZh":"这些数字反映了随时间发生的社会变化。"},{"w":"identify","zh":"识别；确定","phrase":"identify the cause","trans":"确定原因","tip":"阅读题常见","sentence":"The study aims to identify the cause of the problem.","sentenceZh":"这项研究旨在确定问题的原因。"},{"w":"involve","zh":"涉及；包含","phrase":"involve several factors","trans":"涉及多个因素","tip":"常与in连用","sentence":"The decision may involve several factors.","sentenceZh":"这个决定可能涉及几个因素。"},{"w":"require","zh":"要求；需要","phrase":"require more time","trans":"需要更多时间","tip":"常用动词","sentence":"This task will require more time than expected.","sentenceZh":"这项任务需要的时间可能比预计的更多。"},{"w":"obtain","zh":"获得","phrase":"obtain information","trans":"获取信息","tip":"较正式","sentence":"Students can obtain information from reliable sources.","sentenceZh":"学生可以从可靠来源获取信息。"},{"w":"retain","zh":"保留；保持","phrase":"retain information","trans":"记住信息","tip":"与maintain区分","sentence":"Regular review helps us retain information.","sentenceZh":"定期复习有助于我们记住信息。"},{"w":"reveal","zh":"揭示；透露","phrase":"reveal the truth","trans":"揭示真相","tip":"阅读常见","sentence":"The investigation may reveal the truth.","sentenceZh":"调查可能会揭示真相。"},{"w":"reduce","zh":"减少","phrase":"reduce the risk","trans":"降低风险","tip":"反义increase","sentence":"Exercise can help reduce the risk of disease.","sentenceZh":"锻炼有助于降低患病风险。"},{"w":"increase","zh":"增加","phrase":"increase efficiency","trans":"提高效率","tip":"名词和动词","sentence":"Better planning can increase efficiency.","sentenceZh":"更好的规划可以提高效率。"},{"w":"decline","zh":"下降；拒绝","phrase":"a decline in sales","trans":"销量下降","tip":"也作动词拒绝","sentence":"The company reported a decline in sales.","sentenceZh":"该公司报告称销售额出现下降。"},{"w":"expand","zh":"扩大；扩展","phrase":"expand opportunities","trans":"扩大机会","tip":"动词","sentence":"Online courses can expand opportunities for learners.","sentenceZh":"在线课程能够为学习者拓展机会。"},{"w":"emerge","zh":"出现；浮现","phrase":"new problems emerge","trans":"新问题出现","tip":"不及物动词","sentence":"New problems emerge as technology develops.","sentenceZh":"随着技术发展，新的问题不断出现。"},{"w":"adapt","zh":"适应；改编","phrase":"adapt to change","trans":"适应变化","tip":"adapt to与adopt区别","sentence":"People must learn to adapt to change.","sentenceZh":"人们必须学会适应变化。"},{"w":"adopt","zh":"采用；收养","phrase":"adopt a policy","trans":"采取政策","tip":"不是adapt","sentence":"The government decided to adopt a policy to protect workers.","sentenceZh":"政府决定采取一项保护工人的政策。"},{"w":"analyze","zh":"分析","phrase":"analyze the evidence","trans":"分析证据","tip":"英式拼写analyse","sentence":"Researchers analyze the evidence carefully.","sentenceZh":"研究人员认真分析证据。"},{"w":"assess","zh":"评估","phrase":"assess the impact","trans":"评估影响","tip":"常考动词","sentence":"We need to assess the impact of the new rule.","sentenceZh":"我们需要评估这项新规定的影响。"},{"w":"interpret","zh":"解释；理解","phrase":"interpret the data","trans":"解读数据","tip":"与translate不同","sentence":"Different readers may interpret the data differently.","sentenceZh":"不同读者可能以不同方式解读数据。"},{"w":"imply","zh":"暗示；意味着","phrase":"the findings imply that","trans":"研究结果暗示","tip":"区别infer","sentence":"The findings imply that further research is needed.","sentenceZh":"这些发现意味着还需要进一步研究。"},{"w":"infer","zh":"推断","phrase":"infer from evidence","trans":"根据证据推断","tip":"读者推断","sentence":"We can infer from evidence that habits influence learning.","sentenceZh":"我们可以从证据中推断习惯会影响学习。"},{"w":"justify","zh":"证明…合理","phrase":"justify the decision","trans":"证明决定合理","tip":"动词","sentence":"The manager must justify the decision with clear reasons.","sentenceZh":"经理必须用明确的理由证明这个决定是合理的。"},{"w":"perspective","zh":"观点；视角","phrase":"from another perspective","trans":"从另一角度","tip":"名词","sentence":"From another perspective, the result seems positive.","sentenceZh":"从另一个角度看，这个结果似乎是积极的。"},{"w":"objective","zh":"目标；客观的","phrase":"an objective assessment","trans":"客观评价","tip":"形容词和名词","sentence":"The report provides an objective assessment of the situation.","sentenceZh":"这份报告对形势作出了客观评估。"},{"w":"alternative","zh":"替代方案；可供选择的","phrase":"an alternative solution","trans":"替代方案","tip":"常接to","sentence":"The team proposed an alternative solution.","sentenceZh":"团队提出了另一种解决方案。"},{"w":"potential","zh":"潜在的；潜力","phrase":"potential benefits","trans":"潜在益处","tip":"名词和形容词","sentence":"The study examines the potential benefits of exercise.","sentenceZh":"这项研究考察运动的潜在益处。"},{"w":"available","zh":"可获得的；可用的","phrase":"resources available","trans":"可用资源","tip":"常见形容词","sentence":"Not all resources available online are reliable.","sentenceZh":"并非所有网上可获得的资源都可靠。"},{"w":"relevant","zh":"相关的","phrase":"relevant information","trans":"相关信息","tip":"relevant to","sentence":"Please focus on relevant information.","sentenceZh":"请关注相关信息。"},{"w":"accurate","zh":"准确的","phrase":"accurate information","trans":"准确信息","tip":"accuracy为名词","sentence":"The report should provide accurate information." "sentence":"Many people benefit from education.","sentenceZh":"许多人从教育中受益。"},{"w":"resource","zh":"资源","phrase":"limited resources","trans":"有限资源","tip":"可数名词","sentence":"Schools often have limited resources.","sentenceZh":"学校的资源往往有限。"},{"w":"access","zh":"获取途径；使用权","phrase":"access to education","trans":"受教育机会","tip":"名词和动词","sentence":"Some children still lack access to education.","sentenceZh":"一些儿童仍然无法获得受教育的机会。"},{"w":"opportunity","zh":"机会","phrase":"equal opportunities","trans":"平等机会","tip":"名词","sentence":"Everyone deserves equal opportunities.","sentenceZh":"每个人都应享有平等的机会。"},{"w":"capacity","zh":"能力；容量","phrase":"the capacity to learn","trans":"学习能力","tip":"不只是容量","sentence":"Humans have the capacity to learn throughout life.","sentenceZh":"人具有终身学习的能力。"},{"w":"ability","zh":"能力","phrase":"the ability to adapt","trans":"适应能力","tip":"常与to连用","sentence":"Practice improves the ability to adapt.","sentenceZh":"练习能够提高适应能力。"},{"w":"attitude","zh":"态度","phrase":"a positive attitude","trans":"积极态度","tip":"名词","sentence":"A positive attitude can make learning easier.","sentenceZh":"积极的态度能让学习变得更容易。"},{"w":"behavior","zh":"行为","phrase":"consumer behavior","trans":"消费者行为","tip":"英式behaviour","sentence":"The study examines consumer behavior.","sentenceZh":"这项研究考察消费者行为。"},{"w":"motivation","zh":"动机；动力","phrase":"strong motivation","trans":"强烈动机","tip":"名词","sentence":"Clear goals can create strong motivation.","sentenceZh":"明确的目标能产生强烈的动力。"},{"w":"awareness","zh":"意识","phrase":"raise awareness","trans":"提高意识","tip":"名词","sentence":"Public campaigns can raise awareness of the issue.","sentenceZh":"公益宣传活动能够提高公众对这一问题的认识。"},{"w":"responsibility","zh":"责任","phrase":"take responsibility","trans":"承担责任","tip":"名词","sentence":"We should take responsibility for our choices.","sentenceZh":"我们应该为自己的选择承担责任。"},{"w":"commitment","zh":"承诺；投入","phrase":"a long-term commitment","trans":"长期投入","tip":"名词","sentence":"Learning a language requires a long-term commitment.","sentenceZh":"学习语言需要长期投入。"},{"w":"priority","zh":"优先事项","phrase":"a top priority","trans":"首要任务","tip":"名词","sentence":"Improving public health is a top priority.","sentenceZh":"改善公共卫生是一项首要任务。"},{"w":"strategy","zh":"策略","phrase":"a learning strategy","trans":"学习策略","tip":"名词","sentence":"Regular review is a useful learning strategy.","sentenceZh":"定期复习是一种有用的学习策略。"},{"w":"process","zh":"过程；处理","phrase":"the learning process","trans":"学习过程","tip":"名词和动词","sentence":"Mistakes are a natural part of the learning process.","sentenceZh":"犯错是学习过程中的自然组成部分。"},{"w":"procedure","zh":"程序；步骤","phrase":"follow the procedure","trans":"遵循程序","tip":"名词","sentence":"Please follow the procedure carefully.","sentenceZh":"请认真遵循这些步骤。"},{"w":"principle","zh":"原则；原理","phrase":"a basic principle","trans":"基本原则","tip":"区别principal","sentence":"Fairness is a basic principle of the system.","sentenceZh":"公平是这一制度的一项基本原则。"},{"w":"policy","zh":"政策；方针","phrase":"public policy","trans":"公共政策","tip":"名词","sentence":"Public policy can influence economic growth.","sentenceZh":"公共政策能够影响经济增长。"},{"w":"regulation","zh":"规定；监管","phrase":"government regulations","trans":"政府规定","tip":"名词","sentence":"New government regulations may affect businesses.","sentenceZh":"新的政府规定可能影响企业。"},{"w":"standard","zh":"标准","phrase":"meet the standard","trans":"达到标准","tip":"名词和形容词","sentence":"The product must meet the standard.","sentenceZh":"产品必须达到标准。"},{"w":"trend","zh":"趋势","phrase":"a growing trend","trans":"增长趋势","tip":"名词","sentence":"Remote work has become a growing trend.","sentenceZh":"远程工作已成为一种日益增长的趋势。"},{"w":"pattern","zh":"模式；规律","phrase":"a pattern of behavior","trans":"行为模式","tip":"名词","sentence":"Researchers found a pattern of behavior in the data.","sentenceZh":"研究人员在数据中发现了一种行为模式。"},{"w":"evidence","zh":"证据","phrase":"strong evidence","trans":"有力证据","tip":"通常不可数","sentence":"The author presents strong evidence for this view.","sentenceZh":"作者提出有力的证据来支持这一观点。"},{"w":"research","zh":"研究","phrase":"conduct research","trans":"开展研究","tip":"通常不可数","sentence":"Universities conduct research on social issues.","sentenceZh":"大学开展社会问题方面的研究。"},{"w":"survey","zh":"调查","phrase":"a recent survey","trans":"近期调查","tip":"名词和动词","sentence":"A recent survey shows changes in reading habits.","sentenceZh":"最近的一项调查显示阅读习惯正在发生变化。"},{"w":"sample","zh":"样本；样品","phrase":"a small sample","trans":"小样本","tip":"名词","sentence":"The study was based on a small sample.","sentenceZh":"这项研究基于一个较小的样本。"}];
const READINGS=[{"id":"r1","title":"Why Small Habits Matter","subtitle":"原创模拟阅读 · 主题：学习方法 · 基础—中等","minutes":16,"paragraphs":["When students make a study plan, they often begin with an ambitious target: learning a hundred new words a day or reading several long articles every evening. Such plans may create excitement, but they can also be difficult to maintain. A more realistic approach is to build small habits that can be repeated consistently.","Research on learning suggests that the timing of practice matters. Reviewing information shortly after learning it can be useful, but returning to the same information after a delay gives learners a better chance to assess what they actually remember. This is why an unfamiliar word should be tested again after a day or two, rather than simply read ten times in a row.","Another issue is the difference between familiarity and understanding. A word may look familiar because a student has seen it many times. Yet this feeling does not necessarily indicate that the student can explain the word or recognize it in a new sentence. To identify such weak points, learners need to hide the definition and attempt to recall it before checking the answer.","Progress is not always immediate. Some days a learner may remember fewer words than expected, but this does not mean the effort has been wasted. A useful strategy is to treat mistakes as information: words that are repeatedly forgotten should receive more attention, while well-known words can be reviewed less often."],"vocab":["maintain","approach","consistent","indicate","identify","strategy","assess"],"questions":[{"q":"What is the main idea of the passage?","opts":["Long study sessions are necessary for success.","Small, repeatable habits can support effective learning.","Students should avoid setting any study goals.","Learning more words always means remembering more."],"a":1,"why":"全文围绕可持续的小习惯、间隔复习与主动回忆展开；不是否定目标，也不是主张学习时间越长越好。"},{"q":"According to Paragraph 2, delayed review helps learners to ______.","opts":["avoid making any mistakes","judge what they really remember","replace reading with listening","learn all words in a single session"],"a":1,"why":"第二段明确指出隔一段时间后再次接触内容，有助于评估真正记住了什么。"},{"q":"The word “familiarity” in Paragraph 3 is closest in meaning to ______.","opts":["a feeling of recognition","complete mastery","a strong motivation","a careful explanation"],"a":0,"why":"熟悉感是“似曾相识”的识别体验，不等同于能准确解释词义。"},{"q":"The author would most likely agree that mistakes ______.","opts":["prove a student lacks ability","should be hidden during review","can guide future practice","are caused only by poor memory"],"a":2,"why":"最后一段把错误看作反馈：经常忘记的词应该得到更多复习。"}]},{"id":"r2","title":"The Value of Public Libraries","subtitle":"原创模拟阅读 · 主题：公共服务 · 中等","minutes":17,"paragraphs":["In an age when information seems available everywhere, some people question whether public libraries are still necessary. A smartphone can provide access to articles, videos and electronic books within seconds. However, the value of a library cannot be measured simply by counting how many printed books it holds.","For many communities, libraries are among the few places where people can learn without being expected to buy anything. Students may use quiet reading rooms, job seekers may obtain information about training opportunities, and older residents may attend basic technology classes. These services are particularly important for those who cannot afford reliable internet access at home.","Libraries have also begun to adapt to changing patterns of use. Instead of focusing only on lending books, many provide workshops, meeting rooms and assistance with digital resources. Such changes do not mean that books have lost their importance. Rather, they reflect a broader understanding of what public access to knowledge involves.","Of course, these services require funding, and local governments must assess competing priorities. The benefits of libraries may be less obvious than those of a new road or a public sports facility. Yet if decisions are made only on the basis of immediate financial returns, the longer-term social benefits of shared learning spaces could be overlooked."],"vocab":["available","access","obtain","opportunity","adapt","pattern","reflect","assess","priority","benefit"],"questions":[{"q":"Why does the author mention smartphones in Paragraph 1?","opts":["To argue that printed books have no future.","To introduce a challenge to the continuing value of libraries.","To show that libraries should sell electronic devices.","To explain why people no longer enjoy reading."],"a":1,"why":"手机能够快速获取信息，构成对图书馆必要性的质疑，作者随后反驳“仅以藏书量判断价值”的看法。"},{"q":"Which group is said to benefit especially from library services?","opts":["People who own many devices.","People who cannot afford dependable internet at home.","People who rarely use public spaces.","People who prefer private training centers."],"a":1,"why":"第二段末尾明确说明这些服务对负担不起可靠家庭网络的人尤其重要。"},{"q":"The changes described in Paragraph 3 suggest that libraries are ______.","opts":["abandoning their original purpose","adapting to the needs of communities","replacing all books with computers","reducing their public responsibilities"],"a":1,"why":"图书馆增加工作坊、会议室、数字资源帮助，体现服务方式随需求调整。"},{"q":"What concern does the author raise in the final paragraph?","opts":["Libraries receive too much public funding.","Road construction always causes social problems.","Short-term financial measures may miss long-term benefits.","Shared learning spaces are becoming unnecessary."],"a":2,"why":"结尾强调如果只看眼前财务回报，长期社会效益可能被忽视。"}]},{"id":"r3","title":"Rethinking Workplace Flexibility","subtitle":"原创模拟阅读 · 主题：职场与管理 · 中等","minutes":17,"paragraphs":["Flexible working hours have become a significant feature of many modern organizations. Supporters claim that employees can work more efficiently when they have greater control over their schedules. Critics, however, point out that flexibility may create difficulties for coordination, especially when team members need to make decisions together.","One company recently introduced a policy allowing employees to choose when to begin their workday within a two-hour period. Managers initially assumed that productivity would increase immediately. Instead, the first month revealed a more complex pattern: some workers reported fewer interruptions, while others struggled to arrange meetings and obtain quick responses from colleagues.","The company decided not to abandon the policy. It established a daily period during which everyone was expected to be available. Outside those hours, individual teams could adapt their schedules to their tasks. After several months, employees reported that communication had improved, although the effects on overall productivity remained difficult to assess.","The experience suggests that workplace policies should not be judged only by their original intentions. Their consequences depend on how they are introduced, monitored and revised. A strategy that appears effective for one organization may not be appropriate for another."],"vocab":["significant","feature","claim","efficient","policy","assume","complex","establish","available","assess","consequence","appropriate"],"questions":[{"q":"What concern is raised by critics of flexible hours?","opts":["Workers may lose all interest in their jobs.","Coordination within teams may become harder.","Employees may refuse to work from home.","Companies may stop hiring new staff."],"a":1,"why":"第一段指出弹性时间可能给协作带来困难，尤其需要共同决策时。"},{"q":"What did the company discover in the first month?","opts":["The new policy had mixed effects.","Every employee worked more efficiently.","Meetings were no longer required.","Productivity declined in every department."],"a":0,"why":"有些员工干扰减少，另一些员工难以安排会议，说明结果不一。"},{"q":"How did the company respond to the difficulties?","opts":["It ended the policy immediately.","It made all schedules completely fixed.","It introduced shared availability hours.","It stopped evaluating productivity."],"a":2,"why":"第三段提出每日共同在线时段，其他时间保留灵活性。"},{"q":"Which of the following best describes the author’s attitude?","opts":["Unconditionally enthusiastic","Carefully balanced","Strongly opposed","Entirely indifferent"],"a":1,"why":"文章既指出潜在优势，也讨论协调困难，最后主张视实际效果调整。"}]}];
const CLOZE={"id":"c1","title":"Building a Better Study Routine","intro":"原创模拟完形填空 · 10空 · 建议12分钟","parts":["A successful study routine does not have to be complicated. The first step is to set a goal that is ",". If the target is too ambitious, students may find it difficult to "," their motivation. A small daily task can be more useful than an occasional long session.\n\nIt is also important to "," progress regularly. Instead of asking only how many words were studied, learners should check how many they can "," without looking at the answers. This provides more "," evidence of learning.\n\nWhen mistakes ",", students should not immediately assume that their efforts have failed. Errors can "," weak points and help learners choose an appropriate "," for review. Over time, these adjustments may "," to stronger memory and make the whole process more ","."],"questions":[{"opts":["realistic","remote","temporary","ordinary"],"a":0,"why":"set a realistic goal：设定现实可行的目标。"},{"opts":["maintain","measure","divide","exchange"],"a":0,"why":"maintain motivation：保持学习动力。"},{"opts":["avoid","assess","imagine","remove"],"a":1,"why":"assess progress：评估进展。"},{"opts":["retain","refuse","expand","conduct"],"a":0,"why":"retain words：记住词汇，语境中表示无需答案提示仍能记住。"},{"opts":["accurate","anxious","natural","formal"],"a":0,"why":"accurate evidence：更准确的学习证据。"},{"opts":["emerge","decline","agree","return"],"a":0,"why":"mistakes emerge：错误出现。"},{"opts":["reveal","prevent","imitate","protect"],"a":0,"why":"reveal weak points：揭示薄弱环节。"},{"opts":["strategy","resource","barrier","standard"],"a":0,"why":"review strategy：复习策略。"},{"opts":["contribute","object","refer","belong"],"a":0,"why":"contribute to：促成、促进。"},{"opts":["effective","expensive","reluctant","specific"],"a":0,"why":"effective process：有效的过程。"}]};
const MATCHING={"id":"m1","title":"Five Ways to Improve Learning","subtitle":"原创模拟 · 小标题匹配 · 5题","headings":["A. Set a goal you can repeat","B. Review after a delay","C. Test yourself before checking","D. Make use of your mistakes","E. Protect your concentration","F. Buy more learning materials","G. Avoid using examples"],"paragraphs":["It is tempting to begin with a very large task, but a smaller target completed every day is often easier to maintain. Consistency helps build a lasting habit.","Information may feel clear immediately after you read it. Returning to the same material later provides a better test of whether it has been retained.","Before looking up the definition of a word, make an effort to recall its meaning. This attempt helps you identify what you know and what you only recognize.","Words that are repeatedly forgotten should receive more attention. Treat errors as feedback rather than as evidence that learning is impossible.","A quiet place and a short period without phone notifications may help you focus. The quality of attention can matter as much as the length of a session."],"answers":[0,1,2,3,4],"why":["关键词 smaller target / every day 对应可重复的小目标。","Returning ... later 指间隔复习。","Before looking up ... recall 指先回忆后核对。","errors as feedback 指通过错误改进。","quiet place / without notifications 指保护注意力。"]};

plan=function(){return _oldPlan()+`<div class="panel"><h2>V4 · 真题资料与自动评分</h2><p>在「真题中心」录入你有权使用的考研英语二试题。阅读、完形和新题型：上传正确答案后离线自动判分；翻译与作文：对照参考文本和评分要点自评，不伪称AI阅卷。</p><div class="toolbar"><button class="primary" onclick="go('exam')">打开真题中心</button><button onclick="downloadExamTemplate()">下载题目 JSON 模板</button></div><p class="hint">支持旧版 V3 学习记录导入。V4 备份包含词汇进度、作文与翻译草稿、自评记录和真题资料；不要把完整试题备份随意公开分发。</p></div>`};
function exam(){const years=[...new Set(examBank.map(x=>String(x.year)).filter(x=>/^20\d\d$/.test(x)))].sort((a,b)=>Number(b)-Number(a));return `<div class="panel"><div class="row between"><div><h2>真题中心 · 离线练习</h2><p class="muted" style="margin:4px 0">支持阅读 / 完形 / 新题型自动判分、翻译 / 写作参考答案与自评</p></div><span class="tag">${examBank.length} 组已导入</span></div><div class="tabs v4-tabs"><button class="${examTab==='library'?'active':''}" onclick="examTab='library';render()">题库与练习</button><button class="${examTab==='builder'?'active':''}" onclick="examTab='builder';render()">手动录入</button><button class="${examTab==='import'?'active':''}" onclick="examTab='import';render()">批量导入</button><button class="${examTab==='help'?'active':''}" onclick="examTab='help';render()">使用说明</button></div>${examTab==='library'?examLibrary():examTab==='builder'?examBuilder():examTab==='import'?examImporter():examHelp()}</div>`}
function examLibrary(){if(examId){let p=examBank.find(x=>x.id===examId);if(p)return examExercise(p);examId=''}const shown=examBank.filter(x=>(examFilter==='all'||x.type===examFilter)&&(examYearFilter==='all'||String(x.year)===examYearFilter));return `<div class="notice"><b>真实试题不会自动下载：</b>你需要将自己有权使用的试题文本和答案录入或导入。软件不自带、也不冒充历年官方真题。原有原创模拟题仍可在其他模块练习。</div><div class="row" style="margin:18px 0"><label class="small muted">题型 <select aria-label="按题型筛选" onchange="examFilter=this.value;render()"><option value="all">全部题型</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===examFilter?'selected':''}>${v}</option>`).join('')}</select></label><label class="small muted">年份 <select aria-label="按年份筛选" onchange="examYearFilter=this.value;render()"><option value="all">全部年份</option>${[...new Set(examBank.map(x=>String(x.year)).filter(x=>/^20\d\d$/.test(x)))].sort().reverse().map(y=>`<option ${y===examYearFilter?'selected':''} value="${y}">${y}</option>`).join('')}</select></label><span class="muted small">筛选结果 ${shown.length} 组</span></div>${shown.length?`<div class="v4-exams">${shown.map(p=>`<article class="v4-exam-card"><div class="row between"><span class="tag">${esc(TYPES[p.type])}</span><span class="muted small">${esc(p.year||'年份未填')}</span></div><h3>${esc(p.title)}</h3><p class="muted small">${esc(p.source||'用户自备材料')} · ${SUBJECTIVE.includes(p.type)?'参考答案 / 自评':`${p.questions.length} 题 / 自动判分`}</p><div class="toolbar"><button class="primary" onclick="openExam('${p.id}')">${SUBJECTIVE.includes(p.type)?'开始作答':'开始练习'}</button><button class="ghost" onclick="deleteExam('${p.id}')">移除</button></div></article>`).join('')}</div>`:`<div class="v4-empty"><div style="font-size:38px">▣</div><h3>还没有导入的题目</h3><p class="muted">你可以用「手动录入」粘贴合法试题，或者下载模板后批量导入 JSON。下面的演示仅用于测试功能。</p><div class="toolbar" style="justify-content:center"><button class="primary" onclick="examTab='builder';render()">录入自己的真题</button><button onclick="loadExample()">添加原创演示题</button></div></div>`}<div class="line"></div><div class="row between"><span class="hint">* 无法直接解析 PDF 扫描件或自动抓取收费题库。</span><button onclick="downloadExamTemplate()">↓ 下载导入模板</button></div>`}
function openExam(id){examId=id;examResult=null;examSelections={};examWrongOnly=false;examRetryIndices=[];examShowReference=false;render();window.scrollTo(0,0)}
function deleteExam(id){const p=examBank.find(x=>x.id===id);if(!p)return;if(!confirm('确定从当前浏览器题库移除“'+p.title+'”？此操作不删除其他学习记录，建议先导出备份。'))return;examBank=examBank.filter(x=>x.id!==id);if(examId===id)examId='';v4Save();render();toast('已从本地题库移除')}
function examExercise(p){const subj=SUBJECTIVE.includes(p.type),res=examResult&&examResult.id===p.id?examResult:null;return `<div class="row between" style="margin-bottom:10px"><button class="ghost" onclick="examId='';examResult=null;render()">← 返回题库</button><span class="tag">${esc(p.year||'自备')} · ${esc(TYPES[p.type])}</span></div><h2>${esc(p.title)}</h2><p class="muted">来源：${esc(p.source||'用户导入（未核验）')} · ${esc(p.rights||'请自行确认材料使用权限')}</p>${soundSettings()}<div class="toolbar" style="margin:10px 0"><button onclick="speak(examBank.find(x=>x.id===examId).passage)">🔊 英文朗读</button><button onclick="speak(examBank.find(x=>x.id===examId).passage,.75)">🐢 慢速跟读</button><button onclick="stopVoice()">停止</button></div><div class="soft passage v4-passage">${esc(p.passage).replace(/\n/g,'<br>')}</div>${subj?examSubjective(p):examObjective(p,res)}`}
function examObjective(p,res){const indexes=examWrongOnly&&examRetryIndices.length?examRetryIndices:p.questions.map((_,i)=>i);const completed=!!res;return `${examWrongOnly?`<p class="notice">错题重练：仅练上次错题（${indexes.length}题），本轮单独评分。</p>`:''}<p class="hint">先独立完成，再提交。提交前不会显示答案；再次练习重新评分。</p>${indexes.map(i=>{let q=p.questions[i],selected=examSelections[i];return `<div class="question"><div class="question-title">${i+1}. ${esc(q.q)}</div><div class="choicegrid">${q.opts.map((o,j)=>`<button class="choice ${completed?(j===q.a?'correct':selected===j?'wrong':''):selected===j?'selected':''}" ${completed?'disabled':''} onclick="examChoose(${i},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>${completed?`<div class="explain"><b>正确答案 ${String.fromCharCode(65+q.a)} · ${q.points}分</b><div>${esc(q.why||'暂无逐题解析，请结合原资料进行复盘。')}</div></div>`:''}</div>`}).join('')}${completed?`<div class="result-box"><div class="score">${Number(res.earned.toFixed(2))} / ${Number(res.possible.toFixed(2))} 分</div><p>正确 ${res.correct}/${res.count} 题，正确率 ${Math.round(100*res.correct/res.count)}%。${res.wrong.length?`错题：${res.wrong.map(x=>x.i+1).join('、')}。`:'本组全部答对。'}</p><div class="toolbar"><button class="primary" onclick="examResult=null;examSelections={};examWrongOnly=false;examRetryIndices=[];render()">整组重练</button>${res.wrong.length?`<button onclick="retryExamWrong()">只练错题</button>`:''}</div></div>`:`<div class="toolbar"><button class="primary" onclick="gradeExam()" ${indexes.some(i=>examSelections[i]===undefined)?'disabled':''}>提交并自动判分（${indexes.filter(i=>examSelections[i]!==undefined).length}/${indexes.length}）</button><span class="muted small">本轮总分 ${indexes.reduce((a,i)=>a+p.questions[i].points,0)} 分</span></div>`}`}
let examRetryIndices=[];
function examChoose(i,j){examSelections[i]=j;render()}
function gradeExam(){const p=examBank.find(x=>x.id===examId);if(!p||SUBJECTIVE.includes(p.type))return;const inds=examWrongOnly&&examRetryIndices.length?examRetryIndices:p.questions.map((_,i)=>i);if(inds.some(i=>examSelections[i]===undefined)){toast('请先完成全部题目');return}let earned=0,possible=0,correct=0,wrong=[];inds.forEach(i=>{let q=p.questions[i];possible+=q.points;if(examSelections[i]===q.a){earned+=q.points;correct++}else wrong.push({i,chosen:examSelections[i],answer:q.a})});examResult={id:p.id,earned,possible,correct,count:inds.length,wrong};record('imported-objective',p.id,(p.year?p.year+' · ':'')+p.title,`${earned}/${possible}分`,{correct,count:inds.length,wrong:wrong.map(x=>x.i)});render();window.scrollTo({top:document.getElementById('app').offsetTop,behavior:'smooth'})}
function retryExamWrong(){if(!examResult||!examResult.wrong.length)return;examRetryIndices=examResult.wrong.map(x=>x.i);examWrongOnly=true;examSelections={};examResult=null;render()}
function examSubjective(p){const key='imported:'+p.id,draft=extra.drafts[key]||'';const wordCount=draft.trim()?draft.trim().split(/\s+/).length:0;return `<div class="line"></div><h3>我的${p.type==='translation'?'中文翻译':'英文作文'}</h3><p class="hint">独立作答后再展开参考内容。草稿保存在本地（保存失败可复制或导出备份）。</p><textarea id="examDraft" style="min-height:210px" placeholder="在此输入你的答案……" oninput="extra.drafts['${key}']=this.value;v4Save();$('examWords').textContent=this.value.trim()?this.value.trim().split(/\s+/).length:0">${esc(draft)}</textarea><div class="row between"><span class="muted small">词数（空格估算）：<b id="examWords">${wordCount}</b></span><button onclick="copyDraft('examDraft')">复制答案</button></div><div class="toolbar" style="margin:14px 0"><button class="primary" onclick="examShowReference=!examShowReference;render()">${examShowReference?'收起参考答案':'完成后查看参考答案'}</button>${p.type==='writing'?`<button onclick="speak($('examDraft').value)">🔊 朗读我的作文</button>`:''}</div>${examShowReference?`<div class="compare"><div><b>我的答案</b><hr>${esc(extra.drafts[key]||'（尚未输入）')}</div><div><b>${p.type==='translation'?'参考译文':'参考范文'}</b><hr>${esc(p.reference)}</div></div>${selfEvalPanel(key,p.type,p.scoreMax,p.rubric)}`:''}`}
function selfEvalPanel(key,type,maxScore,rubric){let criteria=(rubric&&rubric.length?rubric:(type==='translation'?['关键信息完整，没有漏译','句间逻辑、否定、指代关系准确','重点词义及搭配理解正确','中文表达通顺自然','没有明显增译或误译']:['覆盖题目所有要求','结构完整、逻辑清晰','语法基本准确','词汇使用自然、拼写正确','衔接、语域及表达符合题型要求'])).slice(0,12);let vals=extra.selfRatings[key]||Array(criteria.length).fill(0);let total=vals.reduce((a,v)=>a+Number(v||0),0);let estimate=Math.round(total/(criteria.length*2)*maxScore*10)/10;return `<div class="panel v4-rubric"><div class="row between"><h2>${type==='translation'?'翻译':'写作'} · 逐项自评</h2><span class="tag">参考满分 ${maxScore} · 非官方评分</span></div><p class="hint">根据你与参考答案的对比，逐项选择“未达标 / 部分达标 / 基本达标”。仅根据<strong>你手动选择</strong>计算自评分，网页不会自动判断译文或作文的语义、语法是否正确。</p>${criteria.map((c,i)=>`<div class="v4-rubric-row"><div>${i+1}. ${esc(c)}</div><select aria-label="自评第${i+1}项" onchange="setSelfRating('${key}',${i},this.value,${criteria.length})"><option value="0" ${Number(vals[i]||0)===0?'selected':''}>未达标（0）</option><option value="1" ${Number(vals[i]||0)===1?'selected':''}>部分达标（1）</option><option value="2" ${Number(vals[i]||0)===2?'selected':''}>基本达标（2）</option></select></div>`).join('')}<div class="v4-summary"><span>当前自评分（仅供复盘）</span><strong>${estimate} / ${maxScore}</strong><button class="primary" onclick="storeSelfResult('${key}','${type}',${maxScore},${criteria.length})">保存自评记录</button></div></div>`}
function setSelfRating(key,i,v,n){let a=extra.selfRatings[key]||Array(n).fill(0);a[i]=Number(v);extra.selfRatings[key]=a;v4Save();const el=document.activeElement;render();if(el&&el.blur)el.blur()}
function storeSelfResult(key,type,max,n){let a=extra.selfRatings[key]||Array(n).fill(0),score=Math.round(a.reduce((s,v)=>s+Number(v||0),0)/(2*n)*max*10)/10;record('imported-subjective',key,(type==='translation'?'翻译':'作文')+'自评',`${score}/${max}分（自评）`);toast('已保存自评记录；分数不代表官方阅卷结果')}
function examImporter(){return `<h3>批量导入 JSON</h3><p class="muted">适合已整理成电子文本的合法试题材料。一次可以导入多篇阅读、完形、新题型、翻译或作文。无需API或联网。</p><div class="soft"><label class="checkline"><input type="checkbox" id="rightsAck"><span>我确认这些材料由我合法取得，并有权在个人学习中使用；不会将受版权保护的内容擅自公开传播。</span></label><label class="v4-label">选择 JSON 文件（或包含 JSON 的 TXT）<input id="examImportFile" type="file" accept=".json,.txt,application/json,text/plain"></label><button class="primary" style="margin-top:10px" onclick="importExamFile()">读取并导入</button></div><p class="hint">文件上限 2MB，单次最多 100 组，总题库最多 250 组。题目中必须包含正确答案才能自动判分。未经许可的 PDF、图片扫描不能直接解析。</p><div class="toolbar" style="margin:18px 0"><button onclick="downloadExamTemplate()">↓ 下载可填写的 JSON 模板</button><button onclick="loadExample()">＋ 添加一组原创演示题</button></div><h3>或者粘贴 JSON</h3><textarea id="examRawJSON" spellcheck="false" style="min-height:170px" placeholder='示例：{ "papers": [ { "year": "2018", "type": "reading", "title": "Text 1", "passage": "...", "questions": [ ... ] } ] }'></textarea><div class="toolbar"><button onclick="importExamText()">检查并导入上面的 JSON</button></div><div class="line"></div><h3>更习惯普通文本？</h3><p class="muted">不用编写 JSON：去「手动录入」页，将试题原文和四个选项分别粘贴到对应输入框即可。支持从合法 PDF 的可复制文本中粘贴；目前不具备 PDF 扫描识别。</p><button class="ghost" onclick="examTab='builder';render()">使用可视化录题 →</button>`}
function examHelp(){return `<h3>使用说明</h3><div class="v4-steps"><div><b>1 · 获得有权使用的真题文本和答案</b><p>优先使用正式出版的真题书、你有权访问和使用的电子资料；保留年份、试卷名称、原始来源。这个程序不会自动抓取或复制第三方题库。</p></div><div><b>2 · 导入或手动录入</b><p>简单题量用「手动录入」，整年多组内容用 JSON 模板批量导入。客观题需要题干、选项、答案；翻译与写作需要参考答案和自评要点。</p></div><div><b>3 · 完成做题和批改</b><p>阅读A、新题型和完形按录入答案自动核对，可查看解析并重练错题。翻译和作文逐项自评，不会自动预测官方成绩。</p></div><div><b>4 · 定期备份</b><p>到「计划与数据」导出 V4 完整 JSON 备份，其中包括旧词汇进度、草稿、自评记录、真题材料。更换设备或浏览器后可再次导入。</p></div></div><div class="notice"><b>关于资料准确性：</b>你提供的年份、题目、标准答案和解析未经软件核验。请以原始出版物或权威答案为准，尤其是翻译和作文的参考答案可能不唯一。</div>`}
function makeQuestionBlock(i){return `<div class="v4-builder-q" data-i="${i}"><div class="row between"><b>第 ${i+1} 题</b><span class="muted small">必须填写答案</span></div><label class="v4-label">题干 / 段落提问<input id="bq${i}" placeholder="What is the main idea of the passage?"></label><div class="v4-option-grid">${'ABCDEFG'.split('').map((letter,j)=>`<label class="v4-label v4-option ${j>=4?'v4-extra-option':''}">${letter}. <input id="bopt${i}_${j}" placeholder="选项 ${letter}"></label>`).join('')}</div><div class="row"><label class="v4-label">正确答案 <select id="ba${i}">${'ABCDEFG'.split('').map(x=>`<option>${x}</option>`).join('')}</select></label><label class="v4-label" style="flex:1">解析（可选）<input id="bwhy${i}" placeholder="为什么选这个选项"></label></div></div>`}
function examBuilder(){makerCount=1;return `<h3>可视化录入一组试题</h3><p class="muted">粘贴你有权使用的真题内容，输入答案后就能练习；无需代码知识。一次保存一篇/一组。</p><div class="v4-two"><label class="v4-label">考试年份（可选）<input id="bYear" placeholder="如 2018" inputmode="numeric" maxlength="4"></label><label class="v4-label">题型<select id="bType" onchange="makerChangeType()">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label></div><label class="v4-label">题目名称<input id="bTitle" placeholder="如：2018年英语二 · Text 1" maxlength="120"></label><label class="v4-label">材料来源备注<input id="bSource" placeholder="如：个人购买的真题资料，第xx页" maxlength="160"></label><label class="v4-label">${'文章原文 / 翻译段落 / 作文题目'}<textarea id="bPassage" placeholder="粘贴英文阅读文章、完形文章、翻译原文或作文写作要求……" style="min-height:200px"></textarea></label><div id="makerObjective"><div class="row between" style="margin-top:18px"><h3>选择题与答案</h3><span class="hint">先填写 1 题，最多添加 20 题</span></div><div id="makerQuestions">${makeQuestionBlock(0)}</div><button onclick="addMakerQuestion()">＋ 添加下一道题</button></div><div id="makerSubjective" class="hidden"><label class="v4-label">参考译文 / 参考作文<textarea id="bReference" style="min-height:180px" placeholder="粘贴有权使用的参考译文或范文"></textarea></label><label class="v4-label">自评要点（每行一项）<textarea id="bRubric" placeholder="关键信息无漏译&#10;语法与逻辑关系准确&#10;表达通顺"></textarea></label><label class="v4-label">参考满分 <select id="bMax"><option value="15">15分</option><option value="10">10分</option></select></label></div><label class="checkline"><input id="builderRights" type="checkbox"><span>我确认这些材料用于我有权进行的个人学习，不擅自公开传播受版权保护的试题。</span></label><div class="toolbar"><button class="primary" onclick="saveBuiltExam()">保存到本地题库</button><button onclick="examTab='library';render()">取消录入</button></div><p class="hint">请先粘贴完成再保存；切换页面可能丢失尚未保存的录入文本。</p>`}
let makerCount=1;
function makerChangeType(){let type=$('bType').value;const obj=!SUBJECTIVE.includes(type);$('makerObjective').classList.toggle('hidden',!obj);$('makerSubjective').classList.toggle('hidden',obj);document.querySelectorAll('.v4-extra-option').forEach(el=>el.classList.toggle('hidden',type!=='matching'));$('bMax').value=type==='writing'?'10':'15'}
function addMakerQuestion(){if(makerCount>=20){toast('单组上限20题，可另建下一组');return}let e=document.createElement('div');e.innerHTML=makeQuestionBlock(makerCount);$('makerQuestions').appendChild(e.firstElementChild);makerCount++;makerChangeType()}
function saveBuiltExam(){if(!$('builderRights').checked){toast('请先确认材料的合法使用权限');return}let year=$('bYear').value.trim(),type=$('bType').value,title=$('bTitle').value.trim(),source=$('bSource').value.trim(),passage=$('bPassage').value.trim();if(!title||!passage){toast('请填写题目名称和原文/题目要求');return}if(year&&!/^20\d\d$/.test(year)){toast('年份请填写四位数字，例如 2018');return}let paper={type,year,title,source,passage,rights:'用户确认个人使用权限'};if(SUBJECTIVE.includes(type)){paper.reference=$('bReference').value.trim();paper.rubric=$('bRubric').value.split(/\n/).map(x=>x.trim()).filter(Boolean);paper.scoreMax=Number($('bMax').value);if(!paper.reference){toast('翻译/作文需要填写参考答案以供自评');return}}else{paper.questions=[];for(let i=0;i<makerCount;i++){let q=$('bq'+i).value.trim(),opts='ABCDEFG'.split('').map((_,j)=>$('bopt'+i+'_'+j).value.trim());if(type!=='matching')opts=opts.slice(0,4);while(opts.length&&!opts[opts.length-1])opts.pop();if(!q&&!opts.some(Boolean))continue;let a=$('ba'+i).value.charCodeAt(0)-65;if(!q||opts.length<2||opts.some(x=>!x)||a>=opts.length){toast(`请检查第 ${i+1} 题：题干、连续选项和正确答案`);return}paper.questions.push({q,opts,a,why:$('bwhy'+i).value.trim(),points:POINTS[type]})}if(!paper.questions.length){toast('请至少完整录入一道选择题');return}}try{let p=normalizePaper(paper);appendPapers([p]);examTab='library';examId=p.id;render();toast('录题成功，现在可以开始练习')}catch(err){toast('保存失败：'+err.message)}}
function normalizeAnswer(a,n){if(typeof a==='string'&&/^[A-Ga-g]$/.test(a.trim()))return a.trim().toUpperCase().charCodeAt(0)-65;if(typeof a==='number'&&Number.isInteger(a)&&a>=0&&a<n)return a;throw Error('答案必须是 A–G 或从0开始的选项索引')}
function limitText(x,lim,field){if(typeof x!=='string')throw Error(field+' 必须为文本');if(x.trim().length===0)throw Error(field+' 不能为空');if(x.length>lim)throw Error(field+' 过长，请拆分材料');return x.trim()}
function normalizePaper(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('资料项必须是对象');let type=String(raw.type||''),year=raw.year==null?'':String(raw.year).trim();if(!TYPES[type])throw Error('不支持的题型 '+type);if(year&&!/^20\d\d$/.test(year))throw Error('年份应为四位数字，如2018');let title=limitText(raw.title,180,'题目名称'),passage=limitText(raw.passage,50000,'原文/题目'),source=String(raw.source||'用户自备资料（未核验）').slice(0,240),rights=String(raw.rights||'用户确认已获合法使用权限').slice(0,240);let out={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,9),type,year,title,passage,source,rights,created:today()};if(SUBJECTIVE.includes(type)){out.reference=limitText(raw.reference,50000,'参考答案');out.rubric=(Array.isArray(raw.rubric)?raw.rubric:[]).map(x=>String(x).trim().slice(0,260)).filter(Boolean).slice(0,12);out.scoreMax=Number(raw.scoreMax)||POINTS[type];if(!Number.isFinite(out.scoreMax)||out.scoreMax<=0||out.scoreMax>100)throw Error('满分字段不正确')}else{if(!Array.isArray(raw.questions)||!raw.questions.length||raw.questions.length>40)throw Error('每组需1–40道客观题');out.questions=raw.questions.map((q,i)=>{let opts=q.opts||q.options,stem=q.q||q.stem,an=q.a===undefined?q.answer:q.a;if(!Array.isArray(opts)||opts.length<2||opts.length>7)throw Error('第'+(i+1)+'题选项需要2–7个');opts=opts.map((x,j)=>limitText(x,1000,`第${i+1}题第${j+1}选项`));let a=normalizeAnswer(an,opts.length);if(a>=opts.length)throw Error('第'+(i+1)+'题答案越界');let points=q.points===undefined?POINTS[type]:Number(q.points);if(!Number.isFinite(points)||points<=0||points>20)throw Error('题目分值不正确');return {q:limitText(stem,3000,'第'+(i+1)+'题干'),opts,a,why:String(q.why||q.explanation||'').slice(0,5000),points}})}return out}
function appendPapers(list){if(JSON.stringify(examBank.concat(list)).length>3.5*1024*1024)throw Error('题库数据过大，请先备份并移除部分资料');if(examBank.length+list.length>250)throw Error('当前题库上限250组，请先移除旧资料');examBank.push(...list);v4Save()}
function parsePaperJSON(raw){let data;try{data=JSON.parse(raw)}catch(err){throw Error('不是有效JSON。可使用“手动录入”，或下载模板填写')}let list=Array.isArray(data)?data:Array.isArray(data.papers)?data.papers:Array.isArray(data.exams)?data.exams:[data];if(!list.length||list.length>100)throw Error('请每次导入1至100组题目');let processed=[];for(let i=0;i<list.length;i++){try{processed.push(normalizePaper(list[i]))}catch(err){throw Error('第'+(i+1)+'组：'+err.message)}}return processed}
function importExamText(){if(!$('rightsAck').checked){toast('请先勾选材料合法使用确认');return}let str=$('examRawJSON').value.trim();if(!str){toast('请先粘贴JSON题目数据');return}try{let p=parsePaperJSON(str);appendPapers(p);examTab='library';examId='';render();toast('成功导入 '+p.length+' 组资料')}catch(err){alert('未导入任何题目：\n'+err.message)}}
function importExamFile(){if(!$('rightsAck').checked){toast('请先勾选材料合法使用确认');return}let file=$('examImportFile').files[0];if(!file){toast('请选择 .json 文件');return}if(file.size>2*1024*1024){toast('文件超过2MB，建议拆分导入');return}let r=new FileReader();r.onload=()=>{try{let p=parsePaperJSON(String(r.result));appendPapers(p);examTab='library';examId='';render();toast('成功导入 '+p.length+' 组资料')}catch(err){alert('未导入任何题目：\n'+err.message)}};r.onerror=()=>toast('文件读取失败');r.readAsText(file,'UTF-8')}
function downloadData(data,name){if(window.AndroidAudio){try{window.AndroidAudio.shareJson(String(name),JSON.stringify(data,null,2));toast('已调用安卓分享：可存入笔记或发送给自己');return}catch(e){toast('安卓分享不可用，请复制备份文本')}}let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}

// V4.1: Deep link routing for the 10:00 TickTick task.
// Use #daily for the first unfinished group, and #review for due revision.
// No API keys, remote accounts or personal task IDs are embedded in this public page.
let ticktickEntryMode=false;
const baseVocabView=vocab;
vocab=function(){
 const n=newWords().length,d=dueWords().length;
 const entry=ticktickEntryMode?`<section class="ticktick-entry"><b>☀ 滴答清单 · 10:00 每日英语学习</b><p>已通过学习快捷入口进入。优先完成到期复习，再学习新的30个单词；10:45按原计划休息。</p><div class="steps"><span>10:00–10:15 旧词复习</span><span>10:15–10:35 新词30个</span><span>10:35–10:45 拼写与语境</span></div><div class="toolbar"><button onclick="enterVocab('review')">复习到期词 (${d})</button><button class="primary" onclick="startNextGroup()">学习新词 (${n})</button><button onclick="go('reading')">阅读训练</button></div></section>`:'';
 return entry+baseVocabView();
};
function startNextGroup(){
 const first=newWords()[0];
 if(first===undefined){
  if(dueWords().length){enterVocab('review');return;}
  if(wrongWords().length){enterVocab('wrong');return;}
  go('home');toast('90个词已完成；可进入专项训练或导入新词表');return;
 }
 group=Math.floor(first/30);enterVocab('study');
}
function openStudyShortcut(){
 ticktickEntryMode=true;
 if(dueWords().length){enterVocab('review');return;}
 startNextGroup();
}
function openHashShortcut(){
 const hash=decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
 if(['daily','ticktick','start'].includes(hash)){openStudyShortcut();return;}
 if(['review','words-review'].includes(hash)){ticktickEntryMode=true;enterVocab('review');return;}
 if(hash==='reading'){ticktickEntryMode=false;go('reading');return;}
 const m=/^(?:words|group)-(1|2|3)$/.exec(hash);
 if(m){ticktickEntryMode=true;group=Number(m[1])-1;enterVocab('study');return;}
}
window.addEventListener('hashchange',openHashShortcut);

document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
buildQueue();render();
if(!location.hash){location.hash="#daily"}else{openHashShortcut()};

// Android offline-app import fallback: mobile WebView may not provide the browser's file picker.
function androidImportBackup(){
 try {
  let b=JSON.parse(($('apkBackupPaste')||{}).value||'');
  let v=['KY2_V4_BACKUP','KY2_V3_BACKUP'].includes(b.format)?b.vocabulary:b;
  let e=['KY2_V4_BACKUP','KY2_V3_BACKUP'].includes(b.format)?b.extra:null;
  if(!v||typeof v.progress!=='object'||!v.progress||!Array.isArray(v.history))throw Error('备份格式不正确');
  let bank;
  if(b.format==='KY2_V4_BACKUP'){
   if(!Array.isArray(b.exams)||b.exams.length>250)throw Error('题库内容不正确');
   bank=b.exams.map(normalizePaper);
   bank.forEach((p,i)=>{if(b.exams[i]&&typeof b.exams[i].id==='string'&&/^p[a-z0-9]{6,35}$/.test(b.exams[i].id))p.id=b.exams[i].id});
  }
  if(!confirm('确定用粘贴的备份覆盖当前学习记录吗？请先备份当前进度。'))return;
  db={...v,progress:v.progress||{},history:v.history||[]};
  if(e&&typeof e==='object')extra={attempts:Array.isArray(e.attempts)?e.attempts:[],drafts:e.drafts&&typeof e.drafts==='object'?e.drafts:{},checks:e.checks&&typeof e.checks==='object'?e.checks:{},manualWeak:Array.isArray(e.manualWeak)?e.manualWeak:[],selfRatings:e.selfRatings&&typeof e.selfRatings==='object'?e.selfRatings:{}};
  if(bank)examBank=bank;
  v4Save();buildQueue();examId='';render();toast('离线备份导入成功');
 }catch(err){alert('导入失败：'+err.message)}
}
