plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kyenglish2.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kyenglish2.offline'
        minSdk 24
        targetSdk 32
        versionCode 2
        versionName '4.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
